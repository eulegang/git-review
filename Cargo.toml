[package]
name = "gr-git-review"
version = "0.1.0"
edition = "2024"

description = "A tui for reviewing git changes"
license = "MIT"

repository = "https://github.com/eulegang/git-review"

[[bin]]
name = "git-review"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
eyre = "0.6.12"
git2 = "0.20.2"
ratatui = "0.29.0"
crossterm = "0.28.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
dirs = "6.0.0"
tree-sitter-highlight = "0.26.13"
libloading = "0.9.0"
tree-sitter = "0.26.0"
globset = "0.4.20"
regex = "1.13.1"
frizbee = "0.13.0"
